<!--
  Compatibility stub, not a permanent alias.

  This page existed under its Turkish name until the repository was made
  English-only. Cards flashed before that rename carry the old path inside the
  help QR codes their firmware draws (PIJADE_HELP_CLOCK_PATH,
  PIJADE_HELP_SIGN_PATH in main/qrmode.h), and a flashed card cannot be updated
  by publishing the site. Without this stub those QR codes resolve to a 404.

  Remove both stubs (docs/saat, docs/imza) once every card in use has been
  rewritten with firmware that encodes the English paths.
-->
