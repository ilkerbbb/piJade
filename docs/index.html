<h1>piJade help pages</h1>
<p class="alt">These are the addresses the device shows as QR codes on its screen. Each page is a

<ul>
  <li><a href="clock/">clock</a>: a live clock QR code for <code>Options &gt; OTP &gt; Set Clock</code></li>
